<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web 智能助手</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --line: #e3e6ea;
            --text: #1f2328;
            --muted: #6b7280;
            --brand: #2563eb;
            --user: #2563eb;
            --ai: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 14px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #16a34a;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg { display: flex; gap: 10px; max-width: 780px; width: 100%; margin: 0 auto; }
        .msg.user { flex-direction: row-reverse; }
        .avatar {
            width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; color: #fff;
        }
        .msg.user .avatar { background: var(--user); }
        .msg.ai .avatar { background: #64748b; }
        .bubble {
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.7;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .bubble { background: var(--user); color: #fff; }
        .msg.ai .bubble { background: var(--ai); color: var(--text); border: 1px solid var(--line); }
        form {
            border-top: 1px solid var(--line);
            background: var(--card);
            padding: 14px 20px;
            display: flex;
            gap: 10px;
        }
        #inner { max-width: 780px; width: 100%; margin: 0 auto; display: flex; gap: 10px; }
        textarea {
            flex: 1;
            resize: none;
            height: 46px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        textarea:focus { border-color: var(--brand); }
        button {
            padding: 0 22px;
            border: none;
            border-radius: 10px;
            background: var(--brand);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .hint { max-width: 780px; margin: 0 auto; color: var(--muted); font-size: 13px; padding: 0 0 12px; }
    </style>
</head>
<body>
<header><span class="dot"></span><span>AI Web 智能助手 · GLM-4.7-Flash</span></header>

<div id="chat" role="log" aria-live="polite" aria-label="对话记录">
    <div class="msg ai">
        <div class="avatar">AI</div>
        <div class="bubble">你好，我是接入智谱 GLM 的 AI 助手，有什么可以帮你的？</div>
    </div>
</div>

<form id="form">
    <div id="inner">
        <textarea id="input" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行" aria-label="输入问题"></textarea>
        <button type="submit" id="send">发送</button>
    </div>
</form>

<script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    // 会话 ID：刷新页面后会重新开始一轮对话
    let sessionId = localStorage.getItem('sessionId');
    if (!sessionId) {
        sessionId = crypto.randomUUID();
        localStorage.setItem('sessionId', sessionId);
    }

    function addBubble(role, text) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + role;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '我' : 'AI';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
    }

    async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        input.value = '';
        send.disabled = true;
        addBubble('user', message);
        const bubble = addBubble('ai', '思考中...');

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: sessionId, message: message })
            });
            const data = await res.json();
            bubble.textContent = data.answer || ('出错了：' + (data.error || '未知错误'));
        } catch (e) {
            bubble.textContent = '请求失败，请确认后端已启动：' + e.message;
        } finally {
            send.disabled = false;
            input.focus();
        }
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        sendMessage();
    });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
