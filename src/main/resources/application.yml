server:
  port: 8080

spring:
  application:
    name: aiweb

  # 数据库配置
  # createDatabaseIfNotExist=true 表示：数据库 aiweb 不存在时自动创建，无需手动建库
  datasource:
    url: jdbc:mysql://localhost:3306/aiweb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    # 从环境变量 DB_PASSWORD 读取。这里故意不写默认值，避免把密码写进代码仓库。
    # 未设置时为空白，程序启动时会在控制台给出警告。
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 启动时自动执行 schema.sql 建表（表已存在则跳过，可重复执行）
  sql:
    init:
      mode: always

  # ===== AI 大模型配置（智谱 GLM）=====
  ai:
    # 免费版模型并发极低（约 1），很容易被限流。
    # 这里用「更耐心」的重试策略：最多 4 次，等待 3s → 6s → 12s。
    # 实测免费档成功率约 40%，加大间隔后能明显提高成功率。
    # 注意：GLM-4.7-Flash 是带思考（reasoning）的模型，本身响应就偏慢，别把间隔设太短。
    retry:
      max-attempts: 4
      backoff:
        initial-interval: 3s
        multiplier: 2
        max-interval: 12s
    openai:
      # 从环境变量 ZHIPU_API_KEY 读取，密钥绝不写死在这里
      api-key: ${ZHIPU_API_KEY}
      # 智谱的 OpenAI 兼容地址，末尾不要加斜杠
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        # 关键：Spring AI 默认会拼 "/v1/chat/completions"（OpenAI 的路径），
        # 而智谱的路径是 "/chat/completions"，不覆盖会报 404。
        completions-path: /chat/completions
        options:
          model: glm-4.7-flash
          temperature: 0.7

    # ===== 本地嵌入模型（RAG 认知科普问答用）=====
    # 作用：把中文文本变成一串数字（向量），语义相近的文本向量也相近，
    # 这样用户提问时能匹配到"意思最接近"的考研资料。完全本地运行，不要 Key。
    # 选用 e5-small-v2：多语言模型，对中文支持良好；走 hf-mirror.com 国内镜像，下载更稳。
    model:
      embedding: transformers          # 启用本地 transformers 嵌入（默认就是 transformers，写清楚更直观）
    embedding:
      transformer:
        # 本地 ONNX 嵌入模型（e5-small-v2，多语言、对中文友好），首次使用会从下方地址自动下载并缓存，无需 API Key。
        # 重要：分词器必须放在独立节点 transformer.tokenizer.uri（不在 onnx 下），
        # 否则会回退到框架默认的 all-MiniLM 分词器，与 e5 模型不匹配，导致向量失真、检索失效。
        #
        # 缓存目录必须固定：Spring AI 1.1.8 的默认缓存是每次启动新建的随机临时目录
        # （Files.createTempDirectory("spring-ai-model-cache")），会导致
        # 「每次重启都重新下载 100MB 模型」且临时目录永不清理、越积越多。
        # 这里钉到用户主目录下的固定位置：第一次启动下载一次，之后重启直接复用、秒起。
        cache:
          enabled: true
          directory: ${user.home}/.aiweb/models
        onnx:
          model-uri: https://hf-mirror.com/intfloat/e5-small-v2/resolve/main/model.onnx
        tokenizer:
          uri: https://hf-mirror.com/intfloat/e5-small-v2/raw/main/tokenizer.json

    # ===== MCP Server（模型上下文协议）=====
    # 作用：把本项目能力（院校查询 / 专业查询 / 考研知识咨询 / 学情诊断）按 MCP 协议暴露成标准工具。
    # 任何支持 MCP 的客户端（Cherry Studio / Claude Desktop / Cline 等）连接后，
    # 就能在对话里直接调用这些工具，无需改动本项目任何业务代码。
    # 传输方式：SSE（HTTP 长连接），客户端连接地址 http://localhost:8080/sse。
    # 注意：当前未做鉴权，仅限本地 / 内网演示；对外暴露前必须加访问控制。
    mcp:
      server:
        name: aiweb-kaoyan-mcp        # 服务名，会展示在客户端的服务器列表里
        version: 1.0.0                # 版本号
        type: SYNC                    # 同步模式（配合 Spring MVC；ASYNC 需要 WebFlux）

mybatis-plus:
  configuration:
    # 在控制台打印 SQL，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.aiweb: debug
